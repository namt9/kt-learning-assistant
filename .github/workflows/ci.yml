name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q
      - name: Lời giải mẫu qua hết test
        run: |
          for d in data/problems/*/; do
            gcc -O2 -o /tmp/sol "$d/solution.c"
            for t in "$d"/tests/*.in; do
              diff <(/tmp/sol < "$t") "${t%.in}.out" || { echo "FAIL $t"; exit 1; }
            done
          done
